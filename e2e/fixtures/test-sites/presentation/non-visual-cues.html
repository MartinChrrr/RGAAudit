<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Repères visuels et alternatives</title>
</head>
<body>
  <main>
    <h1>États de commande</h1>
    <p id="status-error" aria-label="État : erreur" style="color: #b91c1c; border-left: 4px solid #b91c1c; padding-left: 8px; position: relative; left: 2px">
      Erreur — le formulaire doit être corrigé.
    </p>
    <p id="status-ok" aria-label="État : valide" style="color: #166534; border-left: 4px solid #166534; padding-left: 8px; position: relative; left: 2px">
      Valide — aucune correction nécessaire.
    </p>
  </main>
</body>
</html>
