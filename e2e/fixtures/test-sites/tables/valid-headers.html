<html lang="fr">
<head><title>En-têtes de tableau valides</title></head>

    <h1>Résultats</h1>

      <caption>Résultats annuels</caption>
      <thead>
        <tr><th scope="col">Année</th><th scope="col">Valeur</th></tr>

    </table>
  </main>
</body>
</html>
