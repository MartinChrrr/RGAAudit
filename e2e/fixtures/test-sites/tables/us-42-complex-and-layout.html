<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Fixture tableaux — critères 5.1 à 5.7</title>
</head>
<body>
  <main>
    <h1>Tableaux de test</h1>
    <table id="complex-data" summary="Organisation des résultats par période et catégorie">
      <caption>Résultats trimestriels par catégorie</caption>
      <thead>
        <tr><th id="period" scope="col">Période</th><th id="category" scope="col" colspan="2">Catégorie</th></tr>
        <tr><th id="quarter" scope="col">Trimestre</th><th id="value" scope="col">Valeur</th><th id="change" scope="col">Évolution</th></tr>
      </thead>
      <tbody>
        <tr><th id="q1" scope="row">T1</th><td headers="period category quarter value">42</td><td headers="period category quarter change">+4</td></tr>
        <tr><th id="q2" scope="row" rowspan="2">T2–T3</th><td headers="period category quarter value">47</td><td headers="period category quarter change">+5</td></tr>
        <tr><td headers="period category quarter value">51</td><td headers="period category quarter change">+4</td></tr>
      </tbody>
    </table>

    <table id="complex-no-summary">
      <thead><tr><th scope="col" colspan="2">Mesures sans résumé</th></tr></thead>
      <tbody><tr><th scope="row">A</th><td>10</td></tr></tbody>
    </table>

    <table id="presentation-layout">
      <tr><td>Logo</td><td>Navigation</td></tr>
      <tr><td>Contenu</td><td>Actions</td></tr>
    </table>
  </main>
</body>
</html>
