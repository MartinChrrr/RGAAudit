<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Parcours interactif</title>
</head>
<body>
  <main>
    <h1>Parcours interactif</h1>
    <button id="next" type="button">Afficher la suite</button>
    <p id="status" aria-live="polite">Étape initiale</p>
    <label for="name">Nom</label>
    <input id="name" name="name" type="text">
    <button id="blocked" type="button">Focus bloqué</button>
    <button id="context" type="button">Changer le contexte</button>
    <div id="motion" hidden>Contenu animé</div>
  </main>
  <style>
    @keyframes rgaudit-pulse { from { opacity: 0.4; } to { opacity: 1; } }
    #motion { animation: rgaudit-pulse 1s infinite; }
  </style>
  <script>
    document.querySelector('#next').addEventListener('click', () => {
      document.querySelector('#status').textContent = 'Étape suivante';
    });
    document.querySelector('#blocked').addEventListener('keydown', (event) => {
      if (event.key === 'Tab') event.preventDefault();
    });
    document.querySelector('#context').addEventListener('click', () => {
      document.title = 'Contexte modifié';
      history.pushState({}, '', '#context');
      document.querySelector('#motion').hidden = false;
      document.querySelector('#status').textContent = 'Contexte modifié';
    });
  </script>
</body>
</html>
